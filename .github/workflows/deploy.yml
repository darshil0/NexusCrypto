name: Deploy static MVP to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow deployments to complete safely.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Lint, Test & Build Static Export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies cleanly
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Code Quality & Linting
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit & Integration tests with coverage
        run: npm run test -- --coverage

      - name: Build static export
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          cp out/index.html out/404.html
          touch out/.nojekyll

      - name: Verify static export output
        run: |
          test -d out
          test -f out/index.html
          test -f out/404.html
          test -f out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
